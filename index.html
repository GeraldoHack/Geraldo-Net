<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pacotes Vodacom</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f2f2f2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      margin-top: 20px;
      max-width: 600px;
      width: 90%;
    }

    .pacote {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .pacote h3 {
      margin: 0 0 10px;
      font-size: 20px;
      color: #333;
    }

    .pacote p {
      margin: 5px 0;
      color: #555;
    }

    .botao-comprar {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 16px;
    }

    .popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      z-index: 1000;
      width: 90%;
      max-width: 400px;
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 999;
    }

    .fechar {
      background: red;
      color: white;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      float: right;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container" id="lista-pacotes">
  <!-- Os pacotes serão inseridos aqui -->
</div>

<div class="overlay" id="overlay"></div>

<div class="popup" id="popup">
  <button class="fechar" onclick="fecharPopup()">Fechar</button>
  <h3 id="popupTitulo"></h3>
  <p id="popupPreco"></p>
  <p id="popupValidade"></p>
  <p>Operadora: Vodacom</p>
</div>

<script>
  const pacotes = [
    { gb: 50, preco: 575 },
    { gb: 60, preco: 690 },
    { gb: 70, preco: 805 },
    { gb: 80, preco: 920 },
    { gb: 90, preco: 1035 },
    { gb: 100, preco: 1150 },
    { gb: 110, preco: 1265 },
    { gb: 120, preco: 1380 },
    { gb: 130, preco: 1495 },
    { gb: 140, preco: 1610 },
    { gb: 150, preco: 1725 },
    { gb: 160, preco: 1840 }
  ];

  const lista = document.getElementById("lista-pacotes");

  pacotes.forEach(p => {
    const item = document.createElement("div");
    item.className = "pacote";
    item.innerHTML = `
      <h3>${p.gb}GB - ${p.preco}MT</h3>
      <p>Válido por 30 dias</p>
      <p>Vodacom</p>
      <button class="botao-comprar" onclick="mostrarPopup(${p.gb}, ${p.preco})">Comprar</button>
    `;
    lista.appendChild(item);
  });

  function mostrarPopup(gb, preco) {
    document.getElementById("popupTitulo").innerText = `${gb}GB`;
    document.getElementById("popupPreco").innerText = `Preço: ${preco}MT`;
    document.getElementById("popupValidade").innerText = "Válido por 30 dias";
    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
  }

  function fecharPopup() {
    document.getElementById("popup").style.display = "none";
    document.getElementById("overlay").style.display = "none";
  }
</script>

</body>
</html>
