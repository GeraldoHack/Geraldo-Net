<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MeGA Chat</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .hidden { display: none; }
        .flex { display: flex; }
        .chat-bubble-sent { 
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border-radius: 18px 18px 4px 18px;
        }
        .chat-bubble-received { 
            background: #f1f5f9;
            color: #334155;
            border-radius: 18px 18px 18px 4px;
        }
        .online-dot {
            width: 12px;
            height: 12px;
            background: #10b981;
            border-radius: 50%;
            border: 2px solid white;
        }
        .typing-indicator {
            display: inline-flex;
            align-items: center;
        }
        .typing-dot {
            width: 6px;
            height: 6px;
            background: #64748b;
            border-radius: 50%;
            margin: 0 1px;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }
        .slide-in { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .google-btn {
            background: white;
            border: 2px solid #f1f5f9;
            border-radius: 12px;
            padding: 12px 24px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .google-btn:hover {
            border-color: #2563eb;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div id="app" class="h-screen max-w-md mx-auto relative bg-white">
        <!-- Loading Screen -->
        <div id="loading" class="fixed inset-0 bg-white flex items-center justify-center z-50">
            <div class="text-center">
                <div class="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-gray-600">Carregando MeGA Chat...</p>
            </div>
        </div>

        <!-- Auth Screen -->
        <div id="auth-screen" class="h-full flex flex-col p-6">
            <div class="flex-1 flex flex-col justify-center items-center">
                <div class="w-20 h-20 bg-gradient-to-br from-blue-600 to-blue-700 rounded-2xl flex items-center justify-center mb-6 shadow-lg">
                    <span class="text-white font-bold text-2xl">MG</span>
                </div>
                <h1 class="text-3xl font-bold text-gray-900 mb-2">MeGA Chat</h1>
                <p class="text-gray-600 text-center mb-8">Conecte-se com seus contactos</p>
                
                <div class="w-full space-y-4">
                    <div class="bg-white p-6 rounded-2xl shadow-lg border border-gray-100">
                        <h2 class="text-lg font-semibold text-gray-900 mb-6 text-center">Entrar com</h2>
                        
                        <button onclick="signInWithGoogle()" id="google-signin-btn" class="google-btn w-full flex items-center justify-center space-x-3">
                            <svg class="w-5 h-5" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            <span class="text-gray-700">Continuar com Google</span>
                        </button>
                    </div>
                    
                    <div class="text-center text-sm text-gray-500">
                        Ao continuar, você concorda com nossos Termos de Serviço
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Chat App -->
        <div id="main-app" class="h-full flex flex-col hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-blue-600 to-blue-700 px-4 py-3 shadow-lg">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <img id="user-avatar" class="w-10 h-10 rounded-full border-2 border-white" src="" alt="Avatar">
                        <div>
                            <h2 class="text-white font-semibold" id="user-display-name">Usuário</h2>
                            <p class="text-blue-100 text-xs" id="user-status">Online</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="toggleSearch()" class="p-2 text-white hover:bg-blue-500 rounded-full transition-all">
                            <i data-lucide="search" class="w-5 h-5"></i>
                        </button>
                        <button onclick="showSettings()" class="p-2 text-white hover:bg-blue-500 rounded-full transition-all">
                            <i data-lucide="settings" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Search Bar -->
                <div id="search-bar" class="mt-3 hidden">
                    <div class="relative">
                        <input type="text" id="search-input" placeholder="Pesquisar conversas..." class="w-full pl-10 pr-4 py-2 rounded-lg bg-blue-500 text-white placeholder-blue-200 focus:outline-none focus:bg-blue-400">
                        <i data-lucide="search" class="w-4 h-4 text-blue-200 absolute left-3 top-3"></i>
                    </div>
                </div>
            </div>

            <!-- Tab Navigation -->
            <div class="bg-white border-b border-gray-200">
                <div class="flex">
                    <button onclick="showTab('chats')" id="tab-chats" class="flex-1 py-3 text-center font-medium text-blue-600 border-b-2 border-blue-600">
                        <i data-lucide="message-circle" class="w-4 h-4 inline-block mr-2"></i>
                        Conversas
                    </button>
                    <button onclick="showTab('contacts')" id="tab-contacts" class="flex-1 py-3 text-center font-medium text-gray-500 border-b-2 border-transparent">
                        <i data-lucide="users" class="w-4 h-4 inline-block mr-2"></i>
                        Contactos
                    </button>
                </div>
            </div>

            <!-- Content Area -->
            <div class="flex-1 overflow-hidden">
                <!-- Chats Tab -->
                <div id="chats-tab" class="h-full flex flex-col">
                    <div class="flex-1 overflow-y-auto">
                        <div id="chats-list" class="divide-y divide-gray-100">
                            <!-- Chats will be loaded here -->
                        </div>
                    </div>
                </div>

                <!-- Contacts Tab -->
                <div id="contacts-tab" class="h-full flex flex-col hidden">
                    <div class="p-3 bg-gray-50 border-b border-gray-200">
                        <div class="relative">
                            <input type="text" id="contacts-search" placeholder="Pesquisar contactos..." class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:border-blue-500">
                            <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-3"></i>
                        </div>
                    </div>
                    <div class="flex-1 overflow-y-auto">
                        <div id="contacts-list" class="divide-y divide-gray-100">
                            <!-- Contacts will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Screen -->
        <div id="chat-screen" class="h-full flex flex-col hidden">
            <!-- Chat Header -->
            <div class="bg-gradient-to-r from-blue-600 to-blue-700 px-4 py-3 shadow-lg">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <button onclick="goBackToChats()" class="p-2 text-white hover:bg-blue-500 rounded-full transition-all">
                            <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        </button>
                        <img id="chat-avatar" class="w-10 h-10 rounded-full border-2 border-white" src="" alt="Avatar">
                        <div>
                            <h2 class="text-white font-semibold" id="chat-contact-name">Contacto</h2>
                            <p class="text-blue-100 text-xs" id="chat-status">Online</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="showContactInfo()" class="p-2 text-white hover:bg-blue-500 rounded-full transition-all">
                            <i data-lucide="info" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Messages Area -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
                <!-- Messages will be loaded here -->
            </div>

            <!-- Message Input -->
            <div class="border-t border-gray-200 bg-white p-3">
                <div class="flex items-center space-x-2">
                    <button class="p-2 text-gray-500 hover:text-blue-600 rounded-full transition-all">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>
                    <div class="flex-1 relative">
                        <input type="text" id="message-input" placeholder="Digite uma mensagem..." class="w-full pl-4 pr-12 py-3 rounded-full border border-gray-300 focus:outline-none focus:border-blue-500">
                        <button class="absolute right-2 top-2 p-1 text-gray-500 hover:text-blue-600 transition-all">
                            <i data-lucide="smile" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <button onclick="sendMessage()" id="send-btn" class="p-3 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition-all">
                        <i data-lucide="send" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAbEP-0s7vx2Lb7nqtc0LD5x_CX57z0Pxo",
            authDomain: "chat-23ecb.firebaseapp.com",
            databaseURL: "https://chat-23ecb-default-rtdb.firebaseio.com",
            projectId: "chat-23ecb",
            storageBucket: "chat-23ecb.appspot.com",
            messagingSenderId: "727504381233",
            appId: "1:727504381233:web:02e17610ae2976408b7c10",
            measurementId: "G-NQSQRXS328"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Google Auth Provider
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        let currentUser = null;
        let currentChat = null;
        let currentTab = 'chats';

        function initApp() {
            console.log("Inicializando MeGA Chat...");
            lucide.createIcons();
            
            // Verificar se já está autenticado
            auth.onAuthStateChanged((user) => {
                if (user) {
                    currentUser = user;
                    checkUserProfile(user);
                } else {
                    showAuthScreen();
                }
                hideLoading();
            });
        }

        function showAuthScreen() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('chat-screen').classList.add('hidden');
        }

        function showMainApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('chat-screen').classList.add('hidden');
            updateUserProfile();
            loadChats();
            loadContacts();
        }

        function showChatScreen() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        async function signInWithGoogle() {
            const button = document.getElementById('google-signin-btn');
            const originalText = button.innerHTML;
            
            try {
                button.innerHTML = '<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin mx-auto"></div>';
                button.disabled = true;
                
                const result = await auth.signInWithPopup(googleProvider);
                console.log("Login Google realizado com sucesso:", result.user);
                
            } catch (error) {
                console.error("Erro no login Google:", error);
                button.innerHTML = originalText;
                button.disabled = false;
                alert('Erro ao fazer login: ' + error.message);
            }
        }

        async function checkUserProfile(user) {
            try {
                const userDoc = await db.collection('users').doc(user.uid).get();
                
                if (userDoc.exists) {
                    // Usuário já tem perfil, mostrar app principal
                    showMainApp();
                } else {
                    // Criar perfil do usuário
                    await createUserProfile(user);
                    showMainApp();
                }
            } catch (error) {
                console.error("Erro ao verificar perfil:", error);
            }
        }

        async function createUserProfile(user) {
            try {
                await db.collection('users').doc(user.uid).set({
                    uid: user.uid,
                    displayName: user.displayName || 'Usuário',
                    email: user.email,
                    photoURL: user.photoURL || '',
                    phoneNumber: user.phoneNumber || '',
                    province: '',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
                    status: 'online',
                    contacts: []
                });
                
                console.log("Perfil do usuário criado com sucesso");
            } catch (error) {
                console.error("Erro ao criar perfil:", error);
            }
        }

        function updateUserProfile() {
            if (!currentUser) return;
            
            document.getElementById('user-display-name').textContent = currentUser.displayName || 'Usuário';
            document.getElementById('user-avatar').src = currentUser.photoURL || 'https://via.placeholder.com/40';
        }

        function showTab(tabName) {
            currentTab = tabName;
            
            // Atualizar botões de tab
            document.getElementById('tab-chats').classList.remove('text-blue-600', 'border-blue-600');
            document.getElementById('tab-contacts').classList.remove('text-blue-600', 'border-blue-600');
            document.getElementById('tab-chats').classList.add('text-gray-500', 'border-transparent');
            document.getElementById('tab-contacts').classList.add('text-gray-500', 'border-transparent');
            
            document.getElementById('tab-' + tabName).classList.remove('text-gray-500', 'border-transparent');
            document.getElementById('tab-' + tabName).classList.add('text-blue-600', 'border-blue-600');
            
            // Mostrar conteúdo da tab
            document.getElementById('chats-tab').classList.add('hidden');
            document.getElementById('contacts-tab').classList.add('hidden');
            document.getElementById(tabName + '-tab').classList.remove('hidden');
        }

        function toggleSearch() {
            const searchBar = document.getElementById('search-bar');
            searchBar.classList.toggle('hidden');
        }

        async function loadChats() {
            if (!currentUser) return;
            
            try {
                const chatsSnapshot = await db.collection('chats')
                    .where('participants', 'array-contains', currentUser.uid)
                    .orderBy('lastMessageAt', 'desc')
                    .get();
                
                const chatsList = document.getElementById('chats-list');
                chatsList.innerHTML = '';
                
                if (chatsSnapshot.empty) {
                    chatsList.innerHTML = `
                        <div class="text-center py-12 text-gray-500">
                            <i data-lucide="message-circle" class="w-12 h-12 mx-auto mb-3 text-gray-400"></i>
                            <p>Nenhuma conversa iniciada</p>
                            <p class="text-sm">Comece uma nova conversa na aba de contactos</p>
                        </div>
                    `;
                    return;
                }
                
                chatsSnapshot.forEach(async (doc) => {
                    const chat = doc.data();
                    const otherUserId = chat.participants.find(uid => uid !== currentUser.uid);
                    const otherUserDoc = await db.collection('users').doc(otherUserId).get();
                    const otherUser = otherUserDoc.data();
                    
                    const chatHTML = `
                        <div class="p-3 hover:bg-gray-50 cursor-pointer transition-all" onclick="openChat('${doc.id}', '${otherUserId}')">
                            <div class="flex items-center space-x-3">
                                <div class="relative">
                                    <img class="w-12 h-12 rounded-full" src="${otherUser.photoURL || 'https://via.placeholder.com/48'}" alt="${otherUser.displayName}">
                                    <div class="online-dot absolute bottom-0 right-0"></div>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center justify-between">
                                        <h3 class="font-semibold text-gray-900 truncate">${otherUser.displayName}</h3>
                                        <span class="text-xs text-gray-500">${formatTime(chat.lastMessageAt?.toDate())}</span>
                                    </div>
                                    <p class="text-sm text-gray-600 truncate">${chat.lastMessage || 'Nenhuma mensagem'}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    chatsList.innerHTML += chatHTML;
                });
                
                lucide.createIcons();
            } catch (error) {
                console.error("Erro ao carregar chats:", error);
            }
        }

        async function loadContacts() {
            if (!currentUser) return;
            
            try {
                // Carregar todos os usuários do sistema (exceto o atual)
                const usersSnapshot = await db.collection('users').where('uid', '!=', currentUser.uid).get();
                const contactsList = document.getElementById('contacts-list');
                contactsList.innerHTML = '';
                
                if (usersSnapshot.empty) {
                    contactsList.innerHTML = `
                        <div class="text-center py-12 text-gray-500">
                            <i data-lucide="users" class="w-12 h-12 mx-auto mb-3 text-gray-400"></i>
                            <p>Nenhum contacto encontrado</p>
                        </div>
                    `;
                    return;
                }
                
                usersSnapshot.forEach((doc) => {
                    const user = doc.data();
                    const contactHTML = `
                        <div class="p-3 hover:bg-gray-50 cursor-pointer transition-all" onclick="startChat('${user.uid}')">
                            <div class="flex items-center space-x-3">
                                <div class="relative">
                                    <img class="w-12 h-12 rounded-full" src="${user.photoURL || 'https://via.placeholder.com/48'}" alt="${user.displayName}">
                                    <div class="online-dot absolute bottom-0 right-0"></div>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <h3 class="font-semibold text-gray-900 truncate">${user.displayName}</h3>
                                    <p class="text-sm text-gray-600 truncate">${user.email}</p>
                                </div>
                                <button class="p-2 text-blue-600 hover:bg-blue-50 rounded-full transition-all">
                                    <i data-lucide="message-circle" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    
                    contactsList.innerHTML += contactHTML;
                });
                
                lucide.createIcons();
            } catch (error) {
                console.error("Erro ao carregar contactos:", error);
            }
        }

        async function startChat(contactId) {
            if (!currentUser) return;
            
            try {
                // Verificar se já existe um chat entre os usuários
                const existingChat = await db.collection('chats')
                    .where('participants', 'array-contains', currentUser.uid)
                    .get();
                
                let chatId = null;
                
                existingChat.forEach((doc) => {
                    const chat = doc.data();
                    if (chat.participants.includes(contactId)) {
                        chatId = doc.id;
                    }
                });
                
                if (!chatId) {
                    // Criar novo chat
                    const chatRef = await db.collection('chats').add({
                        participants: [currentUser.uid, contactId],
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastMessage: '',
                        lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
                        unreadCount: { [currentUser.uid]: 0, [contactId]: 0 }
                    });
                    
                    chatId = chatRef.id;
                }
                
                openChat(chatId, contactId);
            } catch (error) {
                console.error("Erro ao iniciar chat:", error);
            }
        }

        async function openChat(chatId, contactId) {
            currentChat = { id: chatId, contactId: contactId };
            
            try {
                const contactDoc = await db.collection('users').doc(contactId).get();
                const contact = contactDoc.data();
                
                document.getElementById('chat-contact-name').textContent = contact.displayName;
                document.getElementById('chat-avatar').src = contact.photoURL || 'https://via.placeholder.com/40';
                
                showChatScreen();
                loadMessages(chatId);
                setupMessageListener(chatId);
            } catch (error) {
                console.error("Erro ao abrir chat:", error);
            }
        }

        function goBackToChats() {
            showMainApp();
            currentChat = null;
        }

        async function loadMessages(chatId) {
            const messagesContainer = document.getElementById('messages-container');
            messagesContainer.innerHTML = '';
            
            try {
                const messagesSnapshot = await db.collection('chats')
                    .doc(chatId)
                    .collection('messages')
                    .orderBy('timestamp', 'asc')
                    .get();
                
                messagesSnapshot.forEach((doc) => {
                    const message = doc.data();
                    addMessageToUI(message, doc.id);
                });
                
                // Scroll para baixo
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            } catch (error) {
                console.error("Erro ao carregar mensagens:", error);
            }
        }

        function setupMessageListener(chatId) {
            return db.collection('chats')
                .doc(chatId)
                .collection('messages')
                .orderBy('timestamp', 'asc')
                .onSnapshot((snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === 'added') {
                            const message = change.doc.data();
                            addMessageToUI(message, change.doc.id);
                            
                            // Scroll para baixo
                            const messagesContainer = document.getElementById('messages-container');
                            messagesContainer.scrollTop = messagesContainer.scrollHeight;
                        }
                    });
                });
        }

        function addMessageToUI(message, messageId) {
            const messagesContainer = document.getElementById('messages-container');
            const isSent = message.senderId === currentUser.uid;
            
            const messageHTML = `
                <div class="flex ${isSent ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-xs lg:max-w-md px-4 py-2 ${isSent ? 'chat-bubble-sent' : 'chat-bubble-received'}">
                        <p class="text-sm">${message.text}</p>
                        <span class="text-xs opacity-70 block text-right mt-1">${formatTime(message.timestamp?.toDate())}</span>
                    </div>
                </div>
            `;
            
            messagesContainer.innerHTML += messageHTML;
        }

        async function sendMessage() {
            if (!currentChat || !currentUser) return;
            
            const messageInput = document.getElementById('message-input');
            const text = messageInput.value.trim();
            
            if (!text) return;
            
            try {
                // Adicionar mensagem ao chat
                await db.collection('chats')
                    .doc(currentChat.id)
                    .collection('messages')
                    .add({
                        text: text,
                        senderId: currentUser.uid,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        type: 'text'
                    });
                
                // Atualizar último mensagem no chat
                await db.collection('chats')
                    .doc(currentChat.id)
                    .update({
                        lastMessage: text,
                        lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                
                messageInput.value = '';
            } catch (error) {
                console.error("Erro ao enviar mensagem:", error);
                alert('Erro ao enviar mensagem: ' + error.message);
            }
        }

        function formatTime(date) {
            if (!date) return '';
            
            const now = new Date();
            const diff = now - date;
            const diffMinutes = Math.floor(diff / 60000);
            const diffHours = Math.floor(diff / 3600000);
            const diffDays = Math.floor(diff / 86400000);
            
            if (diffMinutes < 1) return 'Agora';
            if (diffMinutes < 60) return `${diffMinutes}m`;
            if (diffHours < 24) return `${diffHours}h`;
            if (diffDays < 7) return `${diffDays}d`;
            
            return date.toLocaleDateString('pt-PT');
        }

        // Event listeners
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Inicializar app
        window.addEventListener('load', function() {
            console.log("MeGA Chat carregado");
            initApp();
        });
    </script>
</body>
</html>
